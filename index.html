<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Território Inhamuns — Painel Interativo</title>
<style>
  :root{
    --bg:#0A1210;
    --bg2:#0F1B18;
    --panel:#13221E;
    --panel2:#172A25;
    --line:rgba(244,239,230,.12);
    --line2:rgba(244,239,230,.22);
    --ink:#F4EFE6;
    --muted:#9DB0A9;
    --honey:#E8A33D;
    --honey2:#F6C766;
    --green:#6FB7A6;
    --red:#D9694F;
    --t2:#DCD5C8;
    --t3:#E7E0D3;
    --bad-ink:#F0A28C;
    --ov3:rgba(244,239,230,.035); --ov4:rgba(244,239,230,.05);
    --ov5:rgba(244,239,230,.06); --ov6:rgba(244,239,230,.075);
    --ov9:rgba(244,239,230,.10); --ov10:rgba(244,239,230,.13);
    --barbg1:rgba(10,18,16,.96); --barbg2:rgba(10,18,16,.72);
    --r:22px;
  }
  body.light{
    --bg:#F5F0E6; --bg2:#EFE7D8; --panel:#FFFCF6; --panel2:#F8F2E6;
    --line:rgba(18,32,28,.13); --line2:rgba(18,32,28,.26);
    --ink:#12201C; --muted:#5B6B64;
    --honey:#A9691A; --honey2:#8A5711; --green:#2C7563; --red:#B0482F;
    --t2:#3B4A44; --t3:#26332E; --bad-ink:#A63E27;
    --barbg1:rgba(245,240,230,.97); --barbg2:rgba(245,240,230,.80);
    --ov3:rgba(18,32,28,.035); --ov4:rgba(18,32,28,.05);
    --ov5:rgba(18,32,28,.06); --ov6:rgba(18,32,28,.07);
    --ov9:rgba(18,32,28,.10); --ov10:rgba(18,32,28,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 78% -10%, rgba(232,163,61,.10), transparent 60%),
      radial-gradient(900px 600px at 8% 108%, rgba(111,183,166,.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    user-select:none;
  }
  #app{height:100vh;display:flex;flex-direction:column;position:relative}

  /* ---------- top bar ---------- */
  .bar{
    display:flex;align-items:center;gap:14px;
    padding:14px 26px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--barbg1),var(--barbg2));
    backdrop-filter:blur(6px);
    min-height:66px;
    opacity:0;pointer-events:none;transition:opacity .4s;
    position:relative;z-index:5;
  }
  body.browsing .bar{opacity:1;pointer-events:auto}
  .back{
    display:flex;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--line2);
    color:var(--ink);font-size:17px;font-weight:600;
    padding:12px 20px;border-radius:999px;cursor:pointer;
  }
  .back:active{transform:scale(.97)}
  .crumb{font-size:17px;color:var(--muted);letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
  .crumb b{color:var(--ink);font-weight:600}
  .bar .sp{flex:1}
  .brandmini{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;flex:0 0 auto;white-space:nowrap}
  @media (max-width:1280px){.brandmini{display:none}}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--honey);box-shadow:0 0 14px var(--honey)}

  /* ---------- views ---------- */
  #view{flex:1;overflow:hidden;position:relative}
  .screen{
    position:absolute;inset:0;overflow:auto;
    padding:22px 40px 26px;
    opacity:0;pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
    transform:translateY(10px);
  }
  .screen.on{opacity:1;pointer-events:auto;transform:none}
  .screen::-webkit-scrollbar{width:0}

  /* ---------- attract ---------- */
  #attract{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;cursor:pointer;padding:40px;
  }
  #attract .kicker{
    font-size:clamp(13px,1.1vw,17px);letter-spacing:.34em;text-transform:uppercase;
    color:var(--honey2);margin-bottom:22px;
  }
  #attract h1{
    font-size:clamp(44px,7.2vw,132px);line-height:.94;font-weight:800;letter-spacing:-.03em;
    margin-bottom:10px;
  }
  #attract h1 span{color:var(--honey)}
  #attract .sub{
    font-size:clamp(17px,1.5vw,26px);color:var(--muted);max-width:940px;line-height:1.45;margin-top:16px;
  }
  .touch{
    margin-top:34px;display:inline-flex;align-items:center;gap:16px;
    padding:20px 38px;border-radius:999px;
    border:1px solid rgba(232,163,61,.5);
    background:linear-gradient(180deg,rgba(232,163,61,.18),rgba(232,163,61,.06));
    font-size:clamp(17px,1.5vw,24px);font-weight:700;color:var(--honey2);
    animation:pulse 2.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,163,61,.0)}50%{box-shadow:0 0 60px 0 rgba(232,163,61,.22)}}
  .evento{
    margin-top:18px;padding:9px 20px;border-radius:999px;
    border:1px solid rgba(232,163,61,.35);background:rgba(232,163,61,.08);
    color:var(--honey2);font-size:clamp(12px,1vw,15px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  }
  .hint{margin-top:10px;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(157,176,169,.6)}
  .sebrae-logo{width:172px;height:93px;display:block;margin:28px auto 0}
  .sebrae-logo svg{width:100%;height:100%;display:block}
  body:not(.light) .sebrae-logo{filter:brightness(0) invert(1);opacity:.92}
  /* marca discreta dentro do rodapé de fontes */
  .foot-logo{display:inline-block;width:52px;height:28px;vertical-align:-8px;margin-right:10px;opacity:.55}
  .foot-logo svg{width:100%;height:100%;display:block}
  body:not(.light) .foot-logo{filter:brightness(0) invert(1);opacity:.5}
  @media (max-width:720px){.foot-logo{width:44px;height:24px;vertical-align:-6px;margin-right:8px}}

  .brandmini .sebrae-logo-sm{width:58px;height:31px;display:inline-block;margin-right:2px}
  .brandmini .sebrae-logo-sm svg{width:100%;height:100%;display:block}
  body:not(.light) .brandmini .sebrae-logo-sm{filter:brightness(0) invert(1);opacity:.85}

  /* ---------- home ---------- */
  .grid-home{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;height:100%}
  .card{
    background:linear-gradient(180deg,var(--panel),var(--bg2));
    border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;position:relative;overflow:hidden;
  }
  .card h2{font-size:clamp(19px,1.5vw,26px);font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
  .card .cap{font-size:14px;color:var(--muted);letter-spacing:.02em}
  .right-col{display:flex;flex-direction:column;gap:26px;min-height:0}

  .score{display:flex;align-items:center;gap:28px;margin-top:14px}
  .card-hero{flex:1;display:flex;flex-direction:column;justify-content:center}
  .score .num{font-size:clamp(52px,5.4vw,86px);font-weight:800;letter-spacing:-.04em;line-height:1}
  .score .num small{font-size:.32em;font-weight:600;color:var(--muted);letter-spacing:0}
  .score .txt{font-size:15px;color:var(--muted);line-height:1.5;max-width:250px}
  .badge{
    display:inline-block;margin-top:10px;padding:8px 16px;border-radius:999px;
    background:rgba(217,105,79,.14);border:1px solid rgba(217,105,79,.45);
    color:var(--bad-ink);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  }
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
  .kpi{background:var(--ov4);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .kpi b{display:block;font-size:clamp(19px,1.95vw,30px);font-weight:800;letter-spacing:-.02em}
  .kpi span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block;margin-top:6px}

  .dims{display:grid;gap:9px;margin-top:16px}
  .dim{
    display:grid;grid-template-columns:170px 1fr 62px;align-items:center;gap:14px;
    padding:11px 14px;border-radius:14px;border:1px solid transparent;cursor:pointer;
    background:var(--ov3);
  }
  .dim:active{transform:scale(.995)}
  .dim:hover{border-color:var(--line2);background:var(--ov6)}
  .dim .nm{font-size:15.5px;font-weight:600}
  .dim .track{height:10px;border-radius:99px;background:var(--ov10);overflow:hidden}
  .dim .fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .dim .vl{font-size:16px;font-weight:800;text-align:right;letter-spacing:-.01em}
  .dim .vl small{font-size:11px;color:var(--muted);font-weight:600}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
  .munis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .muni{
    border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;
    background:linear-gradient(160deg,var(--ov5),rgba(244,239,230,.02));
    display:flex;flex-direction:column;gap:6px;min-height:104px;justify-content:space-between;
  }
  .muni:hover{border-color:rgba(232,163,61,.55)}
  .muni b{font-size:16px;font-weight:700;line-height:1.2}
  .muni span{font-size:12.5px;color:var(--muted)}
  .muni .isdel{font-size:11.5px;color:var(--honey2);font-weight:700;letter-spacing:.04em}

  .cta{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:18px 22px;border-radius:16px;cursor:pointer;
    border:1px solid rgba(111,183,166,.35);
    background:linear-gradient(120deg,rgba(111,183,166,.14),rgba(111,183,166,.04));
  }
  .cta b{font-size:17px}
  .cta span{font-size:13.5px;color:var(--muted);display:block;margin-top:3px}
  .arrow{font-size:24px;color:var(--green)}

  /* ---------- detail screens ---------- */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px}
  .head h1{font-size:clamp(28px,3.1vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1.02}
  .head .meta{font-size:14.5px;color:var(--muted);margin-top:9px;max-width:740px;line-height:1.5}
  .pill{
    padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;
  }
  .ind{display:grid;gap:5px;margin-top:4px}
  .row{display:grid;grid-template-columns:1fr 70px;gap:16px;align-items:center;padding:5px 2px;border-bottom:1px dashed var(--ov6)}
  .row .lb{font-size:14px;color:var(--t2);line-height:1.3}
  .row .track{height:7px;border-radius:99px;background:var(--ov9);overflow:hidden;margin-top:6px}
  .row .fill{height:100%;border-radius:99px}
  .row .vl{font-size:16px;font-weight:800;text-align:right}

  .highlights{display:grid;gap:12px}
  .hl{display:flex;gap:14px;padding:14px 16px;border-radius:16px;background:var(--ov4);border:1px solid var(--line)}
  .hl .ic{width:26px;flex:0 0 26px;font-size:16px;color:var(--honey)}
  .hl p{font-size:14px;line-height:1.5;color:var(--t3)}

  .municard{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
  .stat{background:var(--ov4);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .stat span{font-size:12.5px;color:var(--muted);display:block;text-transform:uppercase;letter-spacing:.1em}
  .stat b{font-size:clamp(20px,2vw,30px);font-weight:800;letter-spacing:-.02em;display:block;margin-top:8px}

  .pot{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .pot .box{border-radius:16px;padding:18px 20px;border:1px solid var(--line)}
  .pot .good{background:linear-gradient(140deg,rgba(111,183,166,.13),transparent)}
  .pot .bad{background:linear-gradient(140deg,rgba(217,105,79,.11),transparent)}
  .pot h4{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .pot p{font-size:15px;line-height:1.55}

  .bars{display:grid;gap:9px;margin-top:8px}
  .dbar{display:grid;grid-template-columns:1fr 66px;gap:14px;align-items:center}
  .dbar .nm{font-size:15px;color:var(--t3)}
  .dbar .t{height:9px;border-radius:99px;background:var(--ov9);overflow:hidden;margin-top:6px}
  .dbar .f{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--honey),var(--honey2))}
  .dbar .v{font-size:16px;font-weight:800;text-align:right}

  .foot{margin-top:26px;font-size:12.5px;color:rgba(157,176,169,.75);line-height:1.5;border-top:1px solid var(--line);padding-top:14px}


  /* ---------- theme toggle ---------- */
  .tbtn{background:var(--ov4);border:1px solid var(--line2);color:var(--honey2);
    width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;flex:0 0 auto;opacity:.9}
  .tbtn:hover{opacity:1;border-color:var(--honey)}
  .tbtn:active{transform:scale(.95)}

  /* ---------- CTA grid ---------- */
  .ctagrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* barra própria de empresas, separada dos atalhos */
  .cta-emp{display:flex;align-items:center;justify-content:space-between;gap:18px;
    padding:18px 22px;border-radius:20px;cursor:pointer;
    border:1px solid rgba(232,163,61,.55);
    background:linear-gradient(120deg,rgba(232,163,61,.22),rgba(232,163,61,.05))}
  .cta-emp:hover{border-color:var(--honey)}
  .cta-emp .t{min-width:0}
  .cta-emp .t b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .cta-emp .t span{display:block;font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.35}
  .cta-emp .kpi-emp{flex:0 0 auto;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--honey2);line-height:1;text-align:right}
  .cta-emp .kpi-emp small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-top:7px;text-align:right}
  @media (max-width:720px){
    .cta-emp{padding:14px 16px;gap:12px}
    .cta-emp .t b{font-size:16.5px}
    .cta-emp .t span{font-size:12.5px}
    .cta-emp .kpi-emp{font-size:23px}
  }
  .cta.sm{padding:14px 16px;gap:10px}
  .cta.sm b{font-size:15px;line-height:1.2;display:block}
  .cta.sm span{font-size:12px;margin-top:4px}
  .cta.sm .arrow{font-size:19px}

  /* ---------- mapa ---------- */
  .mapbg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:142%;opacity:.17;pointer-events:none;z-index:0;overflow:hidden}
  .mapbg svg{height:100%;width:auto;display:block}
  .mapbg path{fill:none;stroke:var(--honey2);stroke-width:1.7}
  .screen > *:not(.mapbg){position:relative;z-index:1}
  #mapa{display:flex;flex-direction:column;min-height:0}
  .mapwrap{display:grid;grid-template-columns:minmax(0,.9fr) minmax(320px,1.1fr);gap:26px;flex:1;min-height:0}
  .mapcard{display:flex;align-items:center;justify-content:center;padding:6px 12px;min-height:0;overflow:hidden}
  .mapsvg{width:100%;height:100%;max-height:100%;min-height:0}
  .marea{cursor:pointer;transition:fill .25s}
  .marea[data-tier="alto"]{fill:rgba(232,163,61,.62)}
  .marea[data-tier="medio"]{fill:rgba(232,163,61,.34)}
  .marea[data-tier="baixo"]{fill:rgba(232,163,61,.17)}
  body.light .marea[data-tier="alto"]{fill:rgba(169,105,26,.72)}
  body.light .marea[data-tier="medio"]{fill:rgba(169,105,26,.44)}
  body.light .marea[data-tier="baixo"]{fill:rgba(169,105,26,.20)}
  body.light .marea{stroke:rgba(18,32,28,.35)}
  .lg{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:7px;vertical-align:-2px;border:1px solid var(--line2)}
  .lg.alto{background:rgba(232,163,61,.62)} .lg.medio{background:rgba(232,163,61,.34)} .lg.baixo{background:rgba(232,163,61,.17)}
  body.light .lg.alto{background:rgba(169,105,26,.62)} body.light .lg.medio{background:rgba(169,105,26,.44)} body.light .lg.baixo{background:rgba(169,105,26,.18)}
  .marea:hover{fill:rgba(232,163,61,.42)!important}
  .mlab{cursor:pointer}
  .mlab text{font-size:30px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:3.4px;stroke-linejoin:round;letter-spacing:.2px}
  .mlab circle{opacity:.85}
  .donut{width:200px;height:200px;border-radius:50%;margin:18px auto 4px;position:relative;display:flex;align-items:center;justify-content:center}
  .donut-hole{width:62%;height:62%;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
  .donut-hole b{font-size:clamp(20px,2vw,28px);font-weight:800;letter-spacing:-.02em}
  .donut-hole span{font-size:11.5px;color:var(--muted);margin-top:2px}
  .dlegend{display:grid;gap:9px;margin-top:16px;width:100%;text-align:left}
  .delta{margin-top:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--green);font-weight:700}
  .dl-item{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;font-size:14px;color:var(--t2)}
  .dl-item i{width:12px;height:12px;border-radius:4px;display:inline-block}
  .dl-item b{font-weight:800;color:var(--ink);font-size:14.5px}

  .mlist{display:grid;gap:8px;margin-top:16px}
  .mrow{display:grid;grid-template-columns:1fr auto 22px;gap:14px;align-items:center;
    padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--ov3);cursor:pointer}
  .mrow:hover{border-color:rgba(232,163,61,.55);background:var(--ov5)}
  .mrow b{font-size:15.5px}
  .mrow em{font-style:normal;font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
  .mrow .iv{font-size:13px;font-weight:800;color:var(--honey2);letter-spacing:.03em}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--muted)}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:7px;vertical-align:-2px;border:1px solid var(--line2)}

  /* ---------- município (compacto, 8 estatísticas) ---------- */
  .municard8{grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
  #muni .head{margin-bottom:12px}
  #muni .stat{padding:12px 14px}
  #muni .stat span{font-size:11px}
  #muni .stat b{font-size:clamp(16px,1.7vw,24px);margin-top:5px}
  #muni .pot{gap:10px}
  #muni .pot .box{padding:13px 15px}
  #muni .pot h4{margin-bottom:5px}
  #muni .pot p{font-size:13.3px;line-height:1.45}
  #muni .card h2{font-size:16px}
  #muni .highlights{gap:8px;margin-top:8px!important}
  #muni .hl{padding:10px 13px}
  #muni .hl p{font-size:12.8px;line-height:1.42}
  #muni .foot{margin-top:12px;padding-top:8px}

  #muni .head>div{min-width:0}
  #muni .head .meta{display:flex;flex-wrap:wrap;gap:8px}
  #muni .head .meta .pill{margin-right:0!important}
  .two-emp{grid-template-columns:.85fr 1.15fr}
  .mrow-emp{grid-template-columns:150px 1fr 70px 22px}
  .vocgrid{grid-template-columns:repeat(3,1fr)}

  /* ---------- celular (retrato estreito) ---------- */
  @media (max-width:720px){
    body{overflow-x:hidden}
    .screen{padding:14px 16px 24px}
    .bar{padding:10px 14px;gap:8px;min-height:56px;flex-wrap:nowrap}
    .back{padding:9px 14px;font-size:14px}
    .crumb{display:none}
    .brandmini{display:none}
    .head{flex-direction:column;align-items:flex-start;gap:10px;margin-bottom:14px}
    .head h1{font-size:clamp(24px,7vw,34px)}
    .head .meta{font-size:13.5px}
    .pill{font-size:11.5px;padding:7px 12px}
    .two,.two-emp,.mapwrap,.priogrid,.vocgrid,.municard,.municard8{grid-template-columns:1fr!important;gap:14px}
    .munis{grid-template-columns:1fr}

function screen(id, html){
  view.innerHTML = `<div class="screen" id="${id}">${html}</div>`;

  const foot = view.querySelector('.screen .foot');
  if(id !== 'home' && foot && SEBRAE_SVG && !foot.querySelector('.foot-logo')){
    const span = document.createElement('span');
    span.className = 'foot-logo';
    span.setAttribute('aria-label','Realização: Sebrae');
    span.innerHTML = SEBRAE_SVG;
    foot.insertBefore(span, foot.firstChild);
  }
  requestAnimationFrame(()=>{
    const el = view.firstElementChild;
    el.classList.add('on');
  });
}

/* ---------- EMPRESAS ---------- */
function donutGradient(porte){
  let acc = 0;
  const parts = porte.map(([n,v,cor])=>{
    const start = acc, end = acc + v; acc = end;
    return `${cor} ${start}% ${end}%`;
  });
  return `conic-gradient(${parts.join(',')})`;
}
function empresas(){
  crumb.innerHTML = `<b>Território ${TERR.nome}</b> — empresas`;
  const maxPct = Math.max(...EMPRESAS.setor.map(s=>s[1]));
  const porMuni = MUNIS.slice().sort((a,b)=>b.empresas-a.empresas);
  const maxMuni = porMuni[0].empresas;
  const shareTaua = Math.round(porMuni[0].empresas / EMPRESAS.total * 100);
  const variacao = EMPRESAS.total - EMPRESAS.anterior;
  const abs = p => Math.round(EMPRESAS.total * p / 100);
  screen('empresas', `
    <div class="head">
      <div><h1>Empresas do território</h1>
      <div class="meta">O número que o Sebrae acompanha de perto: quantas empresas existem, de que porte e em que setor — base para medir formalização e geração de renda.</div></div>
      <div class="pill">${fmt(EMPRESAS.total)} empresas · ${EMPRESAS.atualizado}</div>
    </div>
    <div class="two two-emp" style="align-items:start">
      <div class="card" style="display:flex;flex-direction:column;align-items:center;text-align:center">
        <div class="cap" style="align-self:flex-start">Por porte</div>
        <div class="donut" style="background:${donutGradient(EMPRESAS.porte)}">
          <div class="donut-hole"><b>${fmt(EMPRESAS.total)}</b><span>empresas</span></div>
        </div>
        <div class="dlegend">
          ${EMPRESAS.porte.map(([n,v,cor])=>`<div class="dl-item"><i style="background:${cor}"></i>${n}<b>${v.toFixed(2).replace('.',',')}%</b></div>`).join('')}
        </div>
        <div class="delta">+${fmt(variacao)} empresas desde ${EMPRESAS.dataAnterior}</div>
      </div>
      <div class="card">
        <h2>Por setor</h2>
        <div class="cap">Participação de cada atividade no total de empresas</div>
        <div class="bars" style="margin-top:14px">
          ${EMPRESAS.setor.map(([n,pct,cor])=>`<div class="dbar">
            <div><div class="nm">${n}</div><div class="t"><div class="f" style="width:${(pct/maxPct*100).toFixed(1)}%;background:linear-gradient(90deg,${cor},${cor}bb)"></div></div></div>
            <div class="v">${pct.toFixed(1).replace('.',',')}%<small style="display:block;font-size:11px;color:var(--muted);font-weight:600">≈ ${fmt(abs(pct))}</small></div>
          </div>`).join('')}
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Por município</h2>

      <div class="mlist" style="margin-top:14px">
        ${porMuni.map(m=>`<div class="mrow mrow-emp" onclick="muni('${m.nome}')">

          <div class="t" style="height:9px;border-radius:99px;background:var(--ov9);overflow:hidden"><div style="height:100%;border-radius:99px;background:linear-gradient(90deg,var(--honey),var(--honey2));width:${(m.empresas/maxMuni*100).toFixed(1)}%"></div></div>

/* ---------- PRIORIDADES ---------- */
const PERDAS = DIMS.map(d=>({...d, perdido: d.peso*(10-d.nota)/10})).sort((a,b)=>b.perdido-a.perdido);
const MAXP = PERDAS[0].perdido;

function prior(){
  crumb.innerHTML = `<b>Território ${TERR.nome}</b> — o que fazer primeiro`;
  screen('prior', `
    <div class="head">
      <div><h1>O que fazer primeiro</h1>
      <div class="meta">As seis dimensões não pesam igual no resultado. Abaixo, onde estão os 66 pontos que faltam para chegar a 100 — e o primeiro passo de cada frente.</div></div>
      <div class="pill">${nota(TERR.maturidade)}/100 · ${TERR.nivel}</div>
    </div>
    <div class="priogrid">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="card" style="padding:16px 18px">
          <h2 style="font-size:17px">De onde vêm os 66 pontos que faltam</h2>
          <div class="cap">impacto em pontos = peso (%) × (10 − nota) ÷ 10</div>

            ${PERDAS.map(d=>`<div class="l">
              <div><div class="ln">${d.nome} <span>· peso ${d.peso}% · nota ${(d.disp||nota(d.nota))}/10</span></div>
                <div class="t"><div class="f" style="width:${Math.round(d.perdido/MAXP*100)}%;background:linear-gradient(90deg,${d.cor},${d.cor}99)"></div></div></div>

        </div>
        <div class="card" style="padding:16px 18px">
          <h2 style="font-size:17px">O que já está pronto para alavancar</h2>
          <div class="cap">Não é preciso criar do zero</div>
          <div class="highlights" style="margin-top:10px">
            <div class="hl"><div class="ic">◆</div><p><b>Cultura empreendedora 6,8/10</b> — a dimensão mais forte.</p></div>
            <div class="hl"><div class="ic">◆</div><p><b>Cidade Empreendedor em 100%</b> dos municípios, com Agente de Desenvolvimento.</p></div>
            <div class="hl"><div class="ic">◆</div><p><b>Cobertura bancária em 100%</b>; Sala do Empreendedor em 75%.</p></div>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="pcard destaque">
          <div class="pnum">1</div>
          <div>
            <div class="num">maior peso, pior nota</div>
            <h3>Uma governança que se reúne, monitora e presta contas</h3>
            <p>Redes e governança valem <b>25% do resultado</b> e têm a pior nota: <b>1,8/10</b> — são <b>20,5 dos 66 pontos</b> que faltam. O grupo existe e é representativo (92%); falta rotina: monitorar, comunicar, revisar metas, captar recurso.</p>
            <p class="passo"><b>Primeiro passo:</b> agenda territorial com metas por município, um responsável por monitoramento e um relatório anual público, apoiados no consórcio intermunicipal.</p>
            <div class="ptags"><span class="ptag">Sebrae Inhamuns</span><span class="ptag">consórcio</span><span class="ptag">7 prefeituras</span></div>
          </div>
        </div>

        <div class="pcard">
          <div class="pnum">2</div>
          <div>
            <div class="num">a dor que o empreendedor sente</div>
            <h3>Crédito que chega ao balcão</h3>
            <p>Capital financeiro tem nota <b>2,4/10</b> e é o desafio nº 1 para <b>60,8%</b> dos empreendedores. O crédito concedido por habitante (até R$ 7.400) está na menor faixa avaliada.</p>
            <p class="passo"><b>Primeiro passo:</b> transformar as Salas do Empreendedor em posto de orientação de crédito e garantia (FAMPE, BNB, cooperativas), com acompanhamento de proposta.</p>
            <div class="ptags"><span class="ptag">Salas do Empreendedor</span><span class="ptag">Sebrae</span><span class="ptag">bancos e cooperativas</span></div>
          </div>

        <div class="pcard">

            <p>O mel de aroeira tem <b>Indicação de Procedência</b> (INPI, 2025) e o território é <b>referência estadual e nacional</b> em caprinos e ovinos — mas <b>nenhum dos sete municípios</b> tem Serviço de Inspeção Municipal. Sem o SIM, o produto fica restrito ao comércio local.</p>
            <p class="passo"><b>Primeiro passo:</b> SIM consorciado, uma agroindústria-piloto por cadeia (mel e carne) e marca coletiva do território.</p>
            <div class="ptags"><span class="ptag">consórcio · SIM</span><span class="ptag">agroindústria</span><span class="ptag">INPI · IG</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="foot">Leitura do time a partir do Mapeamento e Diagnóstico TE Inhamuns (jul/2026): notas e pesos das seis dimensões e a síntese de desafios, vocações e pontos de atenção do próprio estudo.</div>
  `);
  push('prior');
}

/* ---------- TEMA ---------- */
function toggleTheme(){
  const light = document.body.classList.toggle('light');
  const b = document.getElementById('tbtn');
  if(b) b.textContent = light ? '☾' : '☀';
  try{ localStorage.setItem('inhamuns-tema', light ? 'claro' : 'escuro'); }catch(e){}
}
(function(){
  let t=null; try{ t = localStorage.getItem('inhamuns-tema'); }catch(e){}
  if(t==='claro'){ document.body.classList.add('light'); }
})();

/* ---------- NAVEGAÇÃO ---------- */
function push(id){ if(stack[stack.length-1] !== id) stack.push(id); }
function go(where){
  if(where==='home'){ stack=[]; home(); }
}
function back(){
  stack.pop();
  const prev = stack[stack.length-1];
  if(!prev){ attract(); return; }
  const [kind,arg] = prev.split(':');
  if(kind==='home') home();
  else if(kind==='dim') dim(arg);
  else if(kind==='muni') muni(arg);
  else if(kind==='vozes') vozes();
  else if(kind==='voc') vocacoes();
  else if(kind==='mapa') mapa();
  else if(kind==='prior') prior();
  else if(kind==='empresas') empresas();
}

/* volta para a tela de atração se ninguém mexer */
let idle;
function resetIdle(){
  clearTimeout(idle);
  idle = setTimeout(()=>{ if(document.body.classList.contains('browsing')) attract(); }, 75000);
}
['click','touchstart','keydown','mousemove'].forEach(e=>document.addEventListener(e,resetIdle));

/* teclado: útil no notebook da feira */
document.addEventListener('keydown', e=>{
  /* TV comum com teclado/controle: entrar a partir da tela de atração */
  if(!document.body.classList.contains('browsing') && (e.key==='Enter'||e.key===' '||e.key==='ArrowRight'||e.key==='ArrowDown')){ e.preventDefault(); home(); return; }
  if(e.key==='Escape'){ document.body.classList.contains('browsing') ? back() : null; }
  if(e.key==='Home'){ attract(); }
  if(e.key==='p'||e.key==='P'){ if(document.body.classList.contains('browsing')) prior(); }
  if(e.key==='m'||e.key==='M'){ if(document.body.classList.contains('browsing')) mapa(); }
  if(e.key==='e'||e.key==='E'){ if(document.body.classList.contains('browsing')) empresas(); }
});

attract();
resetIdle();
</script>
